# Single-container Redis Cluster for local development (Docker Desktop Mac/Windows compatible).
#
# WHY single container:
#   Multi-container clusters fail on Docker Desktop because nodes gossip via their announced
#   IP (127.0.0.1). Inside any container, 127.0.0.1 is that container's own loopback — not
#   another container's loopback — so inter-node gossip never connects and cluster_state stays
#   "fail". Running all 6 Redis instances inside ONE container avoids this: 127.0.0.1:7000-7005
#   are all reachable within the same process space, gossip works, and all ports are published
#   to the host so Java clients can connect normally.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f redis-cluster     # watch startup (~15 seconds)
#   Verify: docker compose exec redis-cluster redis-cli -p 7000 -a RedisCluster@2024 cluster info

services:
  redis-cluster:
    image: redis:7-alpine
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
      - "7004:7004"
      - "7005:7005"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        # ── Start 6 Redis instances on ports 7000-7005 ──────────────────────
        for port in 7000 7001 7002 7003 7004 7005; do
          redis-server \
            --port $$port \
            --cluster-enabled yes \
            --cluster-config-file /tmp/nodes-$$port.conf \
            --cluster-node-timeout 5000 \
            --requirepass $$REDIS_PASSWORD \
            --masterauth  $$REDIS_PASSWORD \
            --daemonize yes \
            --logfile     /tmp/redis-$$port.log \
            --pidfile     /tmp/redis-$$port.pid
          echo "started Redis on port $$port"
        done

        # ── Wait for all instances to accept connections ─────────────────────
        for port in 7000 7001 7002 7003 7004 7005; do
          until redis-cli -p $$port -a $$REDIS_PASSWORD ping 2>/dev/null | grep -q PONG; do
            echo "waiting for port $$port..."; sleep 1
          done
          echo "port $$port is ready"
        done

        # ── Bootstrap the cluster (3 masters + 3 replicas) ──────────────────
        echo "creating cluster..."
        redis-cli --cluster create \
          127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
          127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
          --cluster-replicas 1 -a $$REDIS_PASSWORD --cluster-yes

        echo "cluster ready — connect to 127.0.0.1:7000-7005"
        exec tail -f /dev/null
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
