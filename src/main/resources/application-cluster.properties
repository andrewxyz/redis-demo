# ─── Redis Cluster Profile ─────────────────────────────────────────────────
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=cluster
# Password:       export REDIS_PASSWORD=RedisCluster@2024  (match value in .env)
#
# This file overrides only the Redis connection settings from application.properties.
# All other settings (H2, JPA, logging) are inherited unchanged.

# All 6 cluster nodes — Lettuce connects to all of them and follows MOVED redirects
spring.data.redis.cluster.nodes=127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003,127.0.0.1:7004,127.0.0.1:7005

# Password (resolved from OS environment variable)
spring.data.redis.password=${REDIS_PASSWORD}

# Max number of times Lettuce will follow a MOVED or ASK redirect before giving up
spring.data.redis.cluster.max-redirects=3

# Connection pool (requires commons-pool2 dependency)
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms
