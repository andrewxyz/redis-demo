# ─── Server ────────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory Database (simulates a real DB) ───────────
spring.datasource.url=jdbc:h2:mem:redisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Redis ─────────────────────────────────────────────────
# Change host/port if your Redis is running elsewhere
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ─── Logging: lets you see cache hits/misses in the console ─
logging.level.org.springframework.cache=TRACE
logging.level.com.example.redisdemo=DEBUG
